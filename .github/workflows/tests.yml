# Minimale CI (Audit 16.10.2026, H8): Lint mit bewusst kleiner Ruff-Regelmenge und eine
# schnelle Test-Teilmenge bei jedem Push/PR; die Vollsuite (≈ 1,5 h) nur manuell.
# Keine Secrets, keine Deploy-Schritte. Releases laufen weiterhin über den geprüften
# Fast-Forward auf dem VPS (ARCHITECTURE.md, "Produktion").
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  MPLBACKEND: Agg

jobs:
  quick:
    name: ruff + schnelle Teilmenge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock pytest ruff

      - name: Ruff (E9, F63, F7, F82 aus pyproject.toml)
        run: ruff check .

      - name: Schnelle Teilmenge
        run: >
          python -m pytest
          tests/test_ev_calculator.py
          tests/test_daily3_math.py
          tests/test_no_vig_methods.py
          tests/test_market_benchmark.py
          tests/test_football_dixon_coles.py
          tests/test_football_joint_calibration.py
          tests/test_model_loss_statistics.py
          tests/test_price_floor_policy.py
          tests/test_requirements_lock.py
          -q

  # Audit 25.10.2026 D5: beide Ausfälle vom 25.10. waren Regressionen der Produktionspolicy
  # `floor`, die Suiten liefen aber nur unter `gate` (tests/conftest.py). Lader, Publikation,
  # Daily3, 15K und Karte laufen deshalb bei jedem Push unter beiden Preisregeln; Tests, die nur
  # einen Vertrag beschreiben, tragen @pytest.mark.price_policy.
  price-policy:
    name: Lader/Publikation/Daily3/15K unter ${{ matrix.policy }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        policy: [floor, gate]
    env:
      BETBOY_TEST_PRICE_POLICY: ${{ matrix.policy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock pytest pytest-subtests

      - name: Suiten unter ${{ matrix.policy }}
        run: >
          python -m pytest
          tests/test_ev_signal_sources.py
          tests/test_wettfinder_automation.py
          tests/test_wettfinder_surface.py
          tests/test_wettfinder_statistical_leads.py
          tests/test_tip_publication.py
          tests/test_tip_display_order.py
          tests/test_publication_odds_floor.py
          tests/test_quote_publication_admission.py
          tests/test_highlight_price_checks.py
          tests/test_quality_cached_prices.py
          tests/test_price_refresh_schedule.py
          tests/test_hockey_publication_clock.py
          tests/test_football_original_publication.py
          tests/test_football_opponent_publication.py
          tests/test_bet_finder_ui.py
          tests/test_daily3_backup.py
          tests/test_daily3_comparison.py
          tests/test_daily3_match_context.py
          tests/test_daily3_math.py
          tests/test_daily3_selection.py
          tests/test_daily3_sequence.py
          tests/test_daily3_store.py
          tests/test_daily3_tennis_comparison.py
          tests/test_daily3_ui.py
          tests/test_challenge_15k.py
          tests/test_challenge_15k_model_ui.py
          tests/test_challenge_15k_ui_audit.py
          -q -p no:cacheprovider

  full-a:
    name: Vollsuite Hälfte A (manuell)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # Volle Historie: einige Tests lesen eingefrorene Quellstände per `git show <sha>`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock pytest pytest-subtests

      # Die Suite in einem Prozess überschreitet das Speicherlimit des Runners
      # (Exit 137 bei 36 % am 20.10.2026). Zwei Hälften nach sortierter Dateiliste,
      # wie die bisherige Linux-QA (Gruppen A/B); beide müssen grün sein.
      - name: Vollsuite Hälfte A
        run: |
          files=$(ls tests/test_*.py | sort | awk 'NR % 2 == 1')
          python -m pytest $files -q -p no:cacheprovider

  full-b:
    name: Vollsuite Hälfte B (manuell)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # Volle Historie: einige Tests lesen eingefrorene Quellstände per `git show <sha>`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock pytest pytest-subtests

      # Die Suite in einem Prozess überschreitet das Speicherlimit des Runners
      # (Exit 137 bei 36 % am 20.10.2026). Zwei Hälften nach sortierter Dateiliste,
      # wie die bisherige Linux-QA (Gruppen A/B); beide müssen grün sein.
      - name: Vollsuite Hälfte B
        run: |
          files=$(ls tests/test_*.py | sort | awk 'NR % 2 == 0')
          python -m pytest $files -q -p no:cacheprovider
